<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4A6" />
      <stop offset="50%" stop-color="#E8C36F" />
      <stop offset="100%" stop-color="#B88E34" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E8C36F" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Внешний защитный контур (круг) -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#glowRing)" stroke-width="12" stroke-linecap="round" stroke-dasharray="900 120" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#E8C36F" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 10" />

  <!-- Вписанное геометрическое тело (птица-стрела Сирин в полёте) -->
  <!-- Динамический треугольник / сокол с анатомическим вырезом крыльев -->
  <path d="M 256,92 
           L 396,364 
           L 336,376 
           L 256,296 
           L 176,376 
           L 116,364 Z" 
        fill="url(#goldGrad1)" 
        fill-rule="evenodd" />

  <!-- Внутренний акцентный ромб / сердцевина (ядро защиты) -->
  <path d="M 256,192 
           L 282,234 
           L 256,276 
           L 230,234 Z" 
        fill="#0B0F1C" />
  
  <circle cx="256" cy="234" r="5" fill="#E8C36F" />
</svg>
