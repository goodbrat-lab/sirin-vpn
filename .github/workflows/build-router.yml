name: Build Router (5 architectures)

on:
  push:
    tags:
      - 'router-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: |
            core/engine/go.sum
            apps/router/go.sum

      - name: Build all architectures
        working-directory: apps/router
        run: |
          chmod +x build-all.sh
          VERSION=${GITHUB_REF#refs/tags/router-v}
          VERSION=${VERSION:-1.0.0}
          VERSION=$VERSION ./build-all.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: router-binaries
          path: apps/router/dist/*.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/router-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/router/dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
