name: Build Router (5 architectures)

on:
  push:
    tags:
      - 'router-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: |
            core/engine/go.sum
            apps/router/go.sum

      - name: Build all architectures
        working-directory: apps/router
        run: |
          chmod +x build-all.sh
          VERSION=${GITHUB_REF#refs/tags/router-v}
          VERSION=${VERSION:-1.0.0}
          VERSION=$VERSION ./build-all.sh

      - name: Generate SHA-256 Checksums and GPG Signature
        working-directory: apps/router/dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sha256sum *.tar.gz *.ipk *.apk > checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --armor checksums.txt
            echo "Generated checksums.txt.asc"
          else
            echo "WARNING: GPG_PRIVATE_KEY not set, skipping GPG detached signature"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: router-binaries
          path: |
            apps/router/dist/*.tar.gz
            apps/router/dist/*.ipk
            apps/router/dist/*.apk
            apps/router/dist/checksums.txt
            apps/router/dist/checksums.txt.asc

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/router-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/router/dist/*.tar.gz
            apps/router/dist/*.ipk
            apps/router/dist/*.apk
            apps/router/dist/checksums.txt
            apps/router/dist/checksums.txt.asc
          generate_release_notes: true
          draft: false
          prerelease: false
