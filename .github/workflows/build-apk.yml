name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
      - 'android-v*'
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

permissions:
  contents: write # Нужно для создания релиза и загрузки файлов

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Устанавливаем Java 17 (нужен для Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Устанавливаем Go (нужен для сборки engine.aar)
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: core/engine/go.sum

      # 4. Собираем engine.aar (Go-ядро)
      - name: Build engine.aar
        run: |
          chmod +x core/engine/build-aar.sh
          cd core/engine
          # Устанавливаем gomobile
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          # Инициализируем gomobile (нужен Android SDK/NDK)
          # На ubuntu-latest Android SDK предустановлен, но NDK может отсутствовать.
          # Устанавливаем NDK через sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;30.0.16248370"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370
          gomobile init
          # Собираем AAR для всех архитектур
          ./build-aar.sh --all

      # 4.5. Готовим Config.kt и DebugHashes.kt (с секретом, если доступен)
      - name: Prepare Config files (with secret if available)
        env:
          SIRIN_CONFIG_KT: ${{ secrets.SIRIN_CONFIG_KT }}
        run: |
          # Если секрет есть — используем его (рабочий APK)
          # Если нет — шаблон (dev APK, VPN не подключится)
          if [ -n "$SIRIN_CONFIG_KT" ]; then
            echo "$SIRIN_CONFIG_KT" > apps/android/app/src/main/java/ru/guseynovia/sirin/Config.kt
            echo "Using real Config.kt from GitHub Secrets"
          else
            cp apps/android/app/src/main/java/ru/guseynovia/sirin/Config.kt.template \
               apps/android/app/src/main/java/ru/guseynovia/sirin/Config.kt
            echo "WARNING: SIRIN_CONFIG_KT not set, using template (VPN will not connect)"
          fi

          # DebugHashes всегда из шаблона (пустой список)
          cp apps/android/app/src/debug/java/ru/guseynovia/sirin/DebugHashes.kt.template \
             apps/android/app/src/debug/java/ru/guseynovia/sirin/DebugHashes.kt

      # 4.6. Проверка и подготовка release keystore (fail-fast если секреты отсутствуют)
      - name: Check Keystore Secrets and Setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required keystore secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are missing! Refusing to build debug APK for release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/android/release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > apps/android/keystore.properties
          echo "Release keystore configured from GitHub Secrets."

      # 5. Собираем APK через Gradle (Direct Release)
      - name: Build APK
        run: |
          chmod +x apps/android/gradlew
          cd apps/android
          ./gradlew assembleDirectRelease --no-daemon

      # 6. Переименовываем APK и генерируем контрольные суммы SHA-256 с GPG-подписью
      - name: Rename APK and Generate Signed Checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Если тег не задан (ручной запуск), используем "dev"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="dev"
          fi
          mv apps/android/app/build/outputs/apk/direct/release/app-direct-release.apk \
             apps/android/app/build/outputs/apk/direct/release/sirin-${TAG_NAME}.apk
          
          # Проверяем сертификат подписи через apksigner (если доступен в PATH)
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs apps/android/app/build/outputs/apk/direct/release/sirin-${TAG_NAME}.apk || true
          fi

          # Вычисляем SHA-256 для проверки целостности при самообновлении
          cd apps/android/app/build/outputs/apk/direct/release
          sha256sum sirin-${TAG_NAME}.apk > checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt

          # Подписываем checksums.txt приватным GPG-ключом автора
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --armor checksums.txt
            echo "Generated detached signature checksums.txt.asc:"
            cat checksums.txt.asc
          else
            echo "WARNING: GPG_PRIVATE_KEY not set in secrets, skipping GPG detached signature"
          fi

      # 7. Загружаем APK и контрольные суммы с подписью как артефакт
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: sirin-apk
          path: |
            apps/android/app/build/outputs/apk/direct/release/sirin-*.apk
            apps/android/app/build/outputs/apk/direct/release/checksums.txt
            apps/android/app/build/outputs/apk/direct/release/checksums.txt.asc

      # 8. Создаём релиз и прикрепляем APK, checksums.txt и подпись (только если это тег)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/android/app/build/outputs/apk/direct/release/sirin-*.apk
            apps/android/app/build/outputs/apk/direct/release/checksums.txt
            apps/android/app/build/outputs/apk/direct/release/checksums.txt.asc
          generate_release_notes: true # Автоматически создаст описание из коммитов
          draft: false
          prerelease: false
